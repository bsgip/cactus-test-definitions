Description: Test with a $(...) expression in Preconditions.init_actions
Category: Registration
Classes:
  - A
  - DR-A
TargetVersions:
  - v1.2
Preconditions:
  init_actions:
    - type: create-der-program
      parameters:
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: $(maxImportW)
Steps:
  STEP1:
    event:
      type: GET-request-received
      parameters:
        endpoint: /dcap
    actions:
      - type: remove-steps
        parameters:
          steps:
            - STEP1

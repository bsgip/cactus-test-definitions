Description: Active Control – Generation Limit
Category: Control
Classes:
  # Note - G is explicitly omitted, this test is ONLY for subscription clients who ALSO certify against G class
  - S-G

TargetVersions:
  - v1.2
  - v1.3-beta/storage
  - v1.3

Criteria:
  checks:
    - type: all-steps-complete
      parameters: {}
    - type: all-notifications-transmitted
      parameters: {}

Preconditions:
  init_actions:
    - type: set-comms-rate
      parameters:
        dcap_poll_seconds: 60
        edev_list_poll_seconds: 60
        fsa_list_poll_seconds: 60
        der_list_poll_seconds: 900 # Set to a large value - testing whether they respond due to notification - not polls
        derp_list_poll_seconds: 900 # Set to a large value - testing whether they respond due to notification - not polls
        mup_post_seconds: 60
    - type: create-der-program
      parameters:
        primacy: 0

  checks:
    - type: end-device-contents
      parameters: {}
    - type: der-settings-contents
      parameters: {}
    - type: subscription-contents
      parameters:
        subscribed_resource: /edev/1/derp/1/derc

  actions:
    - type: set-default-der-control
      parameters:
        opModImpLimW: 0
        opModExpLimW: $(maxExportW) # Increased from the 0 defined in TS5573 Table 12.4.4 in order to observe the GEN limit changes without overriding them
        setGradW: 600 # This is increased from the 27 defined in TS5573 Table 12.4.4 in order to comply with the ramps specified
    - type: create-der-control
      parameters:
        start: $(now)
        duration_seconds: 300
        opModGenLimW: $(maxExportW * 2)

  instructions:
    - EndDevice should be registered with active subscriptions before starting.
    - DER shall be generating at least 50% of its active power rating.
    
Steps:

  # NOTE - The majority of this test's validation is watching 

  # (a, b, c)
  # After a short delay (to allow precondition actions to propagate subscriptions) and for device to ramp to full power
  WAIT-CREATE-DERC:
    event:
      type: wait
      parameters:
        duration_seconds: 90
    actions:
      - type: create-der-control
        parameters:
          start: $(now + '5 minutes')
          duration_seconds: 120
          opModGenLimW: 0
      - type: enable-steps
        parameters:
          steps:
            - WAIT-TEST-FINISH
      - type: remove-steps
        parameters:
          steps:
            - WAIT-CREATE-DERC

  # (a, b, c)
  WAIT-TEST-FINISH:
    event:
      type: wait
      parameters:
        duration_seconds: 60 # enough time for the control to be received and ramp down
    actions:
      - type: remove-steps
        parameters:
          steps:
            - WAIT-TEST-FINISH
    instructions:
      - DER should be observed ramping to the 0W control.

Description: Configuration
Category: Demand Response
Classes:
  - DR-A

TargetVersions:
  - v1.2
  - v1.3-beta/storage
  - v1.3


Criteria:
  checks:
    - type: all-steps-complete
      parameters: {}
    - type: end-device-contents
      parameters:
        deviceCategory_anyset: '03FFFFFF' # any of the DeviceCategory bits
    - type: der-capability-contents
      parameters: 
        modesSupported_set: '80' # bit 7 is set - opModFixedW. 

Preconditions:
  immediate_start: true # There will be no "init" phase - all interactions will be immediately logged against the test
  init_actions:
    - type: set-comms-rate
      parameters:
        dcap_poll_seconds: 60
        edev_list_poll_seconds: 60
        fsa_list_poll_seconds: 60
        der_list_poll_seconds: 60
        derp_list_poll_seconds: 60
        mup_post_seconds: 60
    - type: create-der-program
      parameters:         
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: 0
        opModExpLimW: 0
        setGradW: 27

Steps:

  # The test will "start" once the DER list is fetched (signalling the end of ALL-01/ALL-02 discovery)
  GET-DER:
    event:
      type: GET-request-received
      parameters:
        endpoint: /edev/1/der
    actions:
      - type: enable-steps
        parameters:
          steps:
            - PUT-DER-CAPABILITY
      - type: remove-steps
        parameters:
          steps:
            - GET-DER

  PUT-DER-CAPABILITY:
    event:
      type: PUT-request-received
      parameters:
        endpoint: /edev/1/der/1/dercap
    actions:
      - type: remove-steps
        parameters:
          steps:
            - PUT-DER-CAPABILITY

  

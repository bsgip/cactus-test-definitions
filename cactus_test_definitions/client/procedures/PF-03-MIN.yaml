Description: V2G Setpoint (Minimised)
Category: Plugfest
Classes:
  - A

TargetVersions:
  - v1.2
  - v1.3-beta/storage
  - v1.3

Criteria:
  checks:
    - type: all-steps-complete
      parameters: {}
    - type: response-contents
      parameters:
        all: true
        status: 1 # Every control has a received response
    - type: response-contents
      parameters:
        all: true
        status: 2 # Every control has a started response
    - type: response-contents
      parameters:
        all: true
        status: 3 # Every control has a completed response
    - type: all-polls-at-correct-time
      parameters:
        endpoints:
          - /dcap
          - /edev
          - /edev/1/fsa
          - /edev/1/der
          - /edev/1/fsa/1/derp
          - /edev/1/derp/1/dderc
          - /mup
        poll_interval_seconds: 60
        request_type_str: GET

Preconditions:
  init_actions:
    # Accelerated polling for plugfest
    - type: set-comms-rate
      parameters:
        dcap_poll_seconds: 20
        edev_list_poll_seconds: 20
        fsa_list_poll_seconds: 20
        der_list_poll_seconds: 20
        derp_list_poll_seconds: 20
        mup_post_seconds: 60
        mup_list_poll_seconds: 60

    # Create DERProgram / defaults early so that the client is ready to pickup DERControls as soon as the test starts
    - type: create-der-program
      parameters:         
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: 1000
        opModExpLimW: 1000
        setGradW: 27
  checks:
    - type: end-device-contents
      parameters: {}
    - type: der-settings-contents
      parameters: {}
  actions:
    - type: create-der-control
      parameters:
        start: $(now)
        duration_seconds: 120
        opModExpLimW: $(maxExportW * 0.15)
        opModImpLimW: $(maxImportW * 0.15)
        tag: DERC-START
    - type: create-der-control
      parameters:
        start: $(now + '2 minutes')
        duration_seconds: 180
        opModStorageTargetW: 2000
        tag: DERC-DISCHARGE
    - type: create-der-control
      parameters:
        start: $(now + '5 minutes')
        duration_seconds: 180
        opModStorageTargetW: -2000
        tag: DERC-CHARGE
    - type: create-der-control
      parameters:
        start: $(now + '8 minutes')
        duration_seconds: 120
        opModExpLimW: $(maxExportW * 0.15)
        opModImpLimW: $(maxImportW * 0.15)
        tag: DERC-FINISH

Steps:
  WAIT-TEST-END:
    event:
      type: wait
      parameters:
        duration_seconds: 600 # 10 minutes
    actions:
      - type: remove-steps
        parameters:
          steps:
            - WAIT-TEST-END
      - type: finish-test
        parameters: {}


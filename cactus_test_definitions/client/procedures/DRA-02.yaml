Description: Disconnect Instruction
Category: Demand Response
Classes:
  - DR-L
  - DR-G

TargetVersions:
  - v1.2
  - v1.3-beta/storage
  - v1.3

Criteria:
  checks:
    - type: all-steps-complete
      parameters: {}

Preconditions:
  init_actions:
    - type: set-comms-rate
      parameters:
        dcap_poll_seconds: 60
        edev_list_poll_seconds: 60
        fsa_list_poll_seconds: 60
        der_list_poll_seconds: 60
        derp_list_poll_seconds: 60
        mup_post_seconds: 60
    - type: create-der-program
      parameters:         
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: 100 # Altered from the 0 defined in TS5573 in order to observe DER Control effects
        opModExpLimW: 100 # Altered from the 0 defined in TS5573 in order to observe DER Control effects
        setGradW: 27
  checks:
    - type: end-device-contents
      parameters: {}
    - type: der-settings-contents
      parameters: {}
  instructions:
    - The controlled device is connected to the grid and consuming/generating power of at least 50% of its nameplate rating
      
Steps:

  # (a)
  GET-DERC:
    event:
      type: GET-request-received
      parameters:
        endpoint: /edev/1/fsa/1/derp
    actions:
      - type: create-der-control
        parameters:
          start: $(now)
          duration_seconds: 60
          opModConnect: false
          tag: DERC1
      - type: enable-steps
        parameters:
          steps:
            - PUT-DERSTATUS
      - type: remove-steps
        parameters:
          steps:
            - GET-DERC

  # (b)
  PUT-DERSTATUS:
    event:
      type: PUT-request-received
      parameters:
        endpoint: /edev/1/der/1/ders
        serve_request_first: true # Run this AFTER server receives the request
      checks:
        - type: der-status-contents
          parameters:
            alarmStatus: 0
            operationalModeStatus: 100
    actions:
      - type: remove-steps
        parameters:
          steps:
            - PUT-DERSTATUS

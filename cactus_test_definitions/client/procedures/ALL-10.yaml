Description: Update telemetry post rates
Category: Monitoring
Classes:
  - A
  - DR-A

TargetVersions:
  - v1.2
  - v1.3-beta/storage
  - v1.3

Criteria:
  checks:
    - type: all-steps-complete
      parameters:
        ignored_steps: 
          - FAIL-TEST-LENGTH
    - type: voltage-phase-code
      parameters: {}

Preconditions:
  init_actions:
    - type: set-comms-rate
      parameters:
        dcap_poll_seconds: 60
        edev_list_poll_seconds: 60
        fsa_list_poll_seconds: 60
        der_list_poll_seconds: 60
        derp_list_poll_seconds: 60
        mup_post_seconds: 60
        mup_list_poll_seconds: 60
  actions:
    - type: create-der-program
      parameters:         
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: 0
        opModExpLimW: 0
        setGradW: 27
  checks:
    - type: end-device-contents
      parameters: {}

Steps:
  
  # Precondition - ensure that we are getting 60s telemetry
  # This will NOT trigger until our latest reading from ALL MUPs are at 60s
  POST-MUP-60S-INITIAL:
    instructions:
      - All Readings must have a duration of 60s (matching the MirrorUsagePointList post rate).
    event:
      type: POST-request-received
      parameters:
        endpoint: /mup/*
        serve_request_first: true
      checks:
        - type: readings-site-active-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1} 
        - type: readings-site-reactive-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-voltage
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-active-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-reactive-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
    actions:
      - type: enable-steps
        parameters:
          steps:
            - GET-MUP-300S
            - FAIL-TEST-LENGTH  
      - type: remove-steps
        parameters:
          steps:
            - POST-MUP-60S-INITIAL

  # This is a generous "fail time" to ensure that a client doesn't spend an inordinate amount of time picking up
  # and then enacting an updated MUPList post rate.
  FAIL-TEST-LENGTH:
    event:
      type: wait
      parameters:
        duration_seconds: 900 # 15 minutes is more than enough time to swap between a 300s POST and then a 60s POST
    actions:
      - type: finish-test
        parameters: 
          fail_message: The client MUST swap to the MirrorUsagePoint post rate either immediately or after finishing the current reading window.

  # (a, b)
  GET-MUP-300S:
    event:
      type: GET-request-received
      parameters:
        endpoint: /mup
    actions:
      - type: set-comms-rate
        parameters:
          mup_post_seconds: 300 # we leave the pollRate at 60s for quick discovery
      - type: enable-steps
        parameters:
          steps:
            - POST-MUP-300S
      - type: remove-steps
        parameters:
          steps:
            - GET-MUP-300S

  # (c) - This will NOT trigger until our latest reading from ALL MUPs are at 300s
  POST-MUP-300S:
    instructions:
      - New Readings must now have a duration of 300s (matching the updated MirrorUsagePointList post rate).
    event:
      type: POST-request-received
      parameters:
        endpoint: /mup/*
        serve_request_first: true
      checks:
        - type: readings-site-active-power
          parameters: {"reading_length_seconds": 300, "latest_reading_only": true, "minimum_count": 1} 
        - type: readings-site-reactive-power
          parameters: {"reading_length_seconds": 300, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-voltage
          parameters: {"reading_length_seconds": 300, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-active-power
          parameters: {"reading_length_seconds": 300, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-reactive-power
          parameters: {"reading_length_seconds": 300, "latest_reading_only": true, "minimum_count": 1}
    actions:
      - type: enable-steps
        parameters:
          steps:
            - GET-MUP-60S
      - type: remove-steps
        parameters:
          steps:
            - POST-MUP-300S


  # (d, e)
  GET-MUP-60S:
    event:
      type: GET-request-received
      parameters:
        endpoint: /mup
    actions:
      - type: set-comms-rate
        parameters:
          mup_post_seconds: 60 # we leave the pollRate at 60s for quick discovery
      - type: enable-steps
        parameters:
          steps:
            - POST-MUP-60S-FINAL
      - type: remove-steps
        parameters:
          steps:
            - GET-MUP-60S

  # (f) This will NOT trigger until our latest reading from ALL MUPs are at 60s
  POST-MUP-60S-FINAL:
    instructions:
      - New Readings must have a duration of 60s (matching the updated MirrorUsagePointList post rate).
    event:
      type: POST-request-received
      parameters:
        endpoint: /mup/*
        serve_request_first: true
      checks:
        - type: readings-site-active-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1} 
        - type: readings-site-reactive-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-voltage
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-active-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
        - type: readings-der-reactive-power
          parameters: {"reading_length_seconds": 60, "latest_reading_only": true, "minimum_count": 1}
    actions:
      - type: remove-steps
        parameters:
          steps:
            - POST-MUP-60S-FINAL
      - type: finish-test
        parameters: {}

Description: "Dynala and AEMO dynamic-day signal #1"
Category: Plugfest
Classes:
  - A

TargetVersions:
  - v1.3

Criteria:
  checks:
    - type: all-steps-complete
      parameters: {}

Preconditions:
  init_actions:
    # TTI duration carries each component's constant tariff price until its next update.
    # Prices are encoded in AUD/kWh: Dynala decoded rate x 1,000,000; AEMO RRP (AUD/MWh) x 1,000.
    - type: set-comms-rate
      parameters:
        fsa_list_poll_seconds: 20
        tp_list_poll_seconds: 20
        tti_list_poll_seconds: 20
    # Create DERProgram / defaults early so that the client is ready to pickup DERControls as soon as the test starts
    - type: create-der-program
      parameters:         
        primacy: 0
    - type: set-default-der-control
      parameters:
        opModImpLimW: 0
        opModExpLimW: 0
        setGradW: 27

    - type: create-tariff-profile
      parameters:
        primacy: 65
        fsa_id: 1
        price_pow_10_multiplier: -6
        tag: TP-DYNALA-IMPORT
    - type: create-tariff-profile
      parameters:
        primacy: 65
        fsa_id: 1
        price_pow_10_multiplier: -6
        tag: TP-DYNALA-EXPORT
    - type: create-tariff-profile
      parameters:
        primacy: 66
        fsa_id: 1
        price_pow_10_multiplier: -6
        tag: TP-AEMO-IMPORT

    - type: create-rate-component
      parameters:
        tariff_profile_tag: TP-DYNALA-IMPORT
        flow_direction: 1 # FlowDirectionType.FORWARD
        power_of_ten_multiplier: 3
        uom: 72 # UomType.REAL_ENERGY_WATT_HOURS
        tag: RC-DYNALA-IMPORT
    - type: create-rate-component
      parameters:
        tariff_profile_tag: TP-DYNALA-EXPORT
        flow_direction: 19 # FlowDirectionType.REVERSE
        power_of_ten_multiplier: 3
        uom: 72 # UomType.REAL_ENERGY_WATT_HOURS
        tag: RC-DYNALA-EXPORT
    - type: create-rate-component
      parameters:
        tariff_profile_tag: TP-AEMO-IMPORT
        flow_direction: 1 # FlowDirectionType.FORWARD
        power_of_ten_multiplier: 3
        uom: 72 # UomType.REAL_ENERGY_WATT_HOURS
        tag: RC-AEMO-IMPORT
  checks:
    - type: end-device-contents
      parameters: {}
    - type: der-settings-contents
      parameters: {}

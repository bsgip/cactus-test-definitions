Description: S-STO-03 Storage Target Control with Export Limits
Category: Storage
Classes:
 - STO

TargetVersions:
 - v1.3

Preconditions:
  required_clients:
    - id: client
  
Steps:
  - id: PRECONDITION
    repeat_until_pass: true
    admin_instructions:
      - type: ensure-end-device
        parameters:
          registered: true
      - type: create-default-der-control
        parameters:
          opModExpLimW: 1500
    action:
      type: discovery
      parameters:
        resources:
          - EndDevice
          - DER
          - DERControl
          - DefaultDERControl
    checks:
      - type: end-device 
        parameters:
          matches_client: true 
      - type: default-der-control
        parameters:
          opModExpLimW: 1500
          minimum_count: 1
      - type: der-control
        parameters:
          maximum_count: 0

  - id: 1 - CREATE DERCONTROL
    repeat_until_pass: true
    admin_instructions:
      - type: create-der-control
        parameters:
          status: scheduled
          opModExpLimW: 2000
          opModStorageTargetW: 1000
    action:
      type: discovery
      parameters:
        resources:
          - DERControl
    checks:
      - type: der-control
        parameters:
          minimum_count: 1
          maximum_count: 1
          event_status: 0 # Scheduled
          opModExpLimW: 2000
          opModStorageTargetW: 1000

  - id: 2,3 - NOTIFY RECEIVED
    action: 
      type: respond-der-controls
    checks:
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 1 # EVENT_RECEIVED

  - id: 4 - WAIT STARTED
    repeat_until_pass: true
    action:
      type: discovery
      parameters:
        resources:
          - DERControl
    checks:
      - type: der-control
        parameters:
          minimum_count: 1
          maximum_count: 1
      - type: der-control
        parameters:
          minimum_count: 1
          maximum_count: 1
          event_status: 1 # Active
          opModExpLimW: 2000
          opModStorageTargetW: 1000

  - id: 5,6,7,8 - NOTIFY STARTED, COMPLETED
    repeat_until_pass: true # Wait until we have submitted started and completed Responses
    action: 
      type: respond-der-controls
    checks:
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 1 # EVENT_RECEIVED
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 2 # EVENT_STARTED
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 3 # EVENT_COMPLETED

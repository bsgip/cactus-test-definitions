Description: S-STO-03 Storage Target Control with Export Limits
Category: Storage
Classes:
 - STO

TargetVersions:
 - v1.3

Preconditions:
  required_clients:
    - id: client
  
Steps:
  - id: PRECONDITION
    repeat_until_pass: true
    client: client
    admin_instructions:
      - type: ensure-end-device
        parameters:
          registered: true
      - type: create-default-der-control
        parameters:
          opModExpLimW: 1500
    action:
      type: discovery
      parameters:
        resources:
          - EndDevice
          - DERControlList
          - DER
          - DERControl
    checks:
      - type: end-device 
        parameters:
          matches_client: true 
      - type: default-der-control
        parameters:
          opModExpLimW: 1500
          minimum_count: 1
      - type: der-control
        parameters:
          maximum_count: 0

  - id: 1 - CREATE DERCONTROL
    repeat_until_pass: true
    client: client
    admin_instructions:
      - type: create-der-control
        parameters:
          status: scheduled
          opModExpLimW: 2000
          opModStorageTargetW: 1000
    action:
      type: discovery
      parameters:
        resources:
          - DERControl
    checks:
      - type: der-control
        parameters:
          minimum_count: 1
          maximum_count: 1
          event_status: 0 # Scheduled
          opModExpLimW: 2000
          opModStorageTargetW: 1000

  - id: 2..9 - NOTIFY DERCONTROL
    repeat_until_pass: true # Wait until we have submitted started and completed Responses
    client: client
    action: 
      type: respond-der-controls # keep checking for Responses - continue until we've sent 2 (started) and 3 (completed)
    checks:
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 1 # EVENT_RECEIVED
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 2 # EVENT_STARTED
      - type: der-control-responses
        parameters:
          minimum_count: 1
          maximum_count: 1
          sent_response_type: 3 # EVENT_COMPLETED
Description: S-SDVN-01 Service Discovery and Schema Version Negotiation
Category: Registration
Classes:
 - A

TargetVersions:
 - v1.3

Preconditions:
  required_clients:
    - id: client

Steps:
  - id: PRECONDITION
    repeat_until_pass: true
    admin_instructions:
      - type: ensure-end-device
        parameters:
          registered: false
    action:
      type: discovery
      parameters:
        resources:
          - EndDevice
    checks:
      - type: end-device # Block until there is NO EndDevice registered
        parameters:
          matches_client: false

  - id: 1 - DISCOVER WELL-KNOWN
    action:
      type: well-known-discovery
      parameters: {}
    checks:
      - type: well-known-discovered
        parameters:
          versions:
            - v1.2
          matches_dcap: true
          minimum_count: 1
          maximum_count: 1

  # Perform a normal discovery of the DeviceCapability
  - id: 2,3 - FETCH DCAP
    action: 
      type: refresh-resource
      parameters:
        resource: DeviceCapability
  
  - id: 4,5 - FETCH DCAP (EQUAL VERSIONS)
    action: 
      type: refresh-resource
      parameters:
        resource: DeviceCapability
        version_value_overrides:
          - v1.2
          - v1.3
        version_qf_overrides:
          - 1
          - 1

  - id: 6,7 - FETCH DCAP (UNKNOWN VERSION PREFERENCE)
    action: 
      type: refresh-resource
      parameters:
        resource: DeviceCapability
        version_value_overrides:
          - v99-beta
          - v1.3
        version_qf_overrides:
          - 1
          - 0.5

  - id: 8,9 - FETCH DCAP (NO VERSION)
    action: 
      type: refresh-resource
      parameters:
        resource: DeviceCapability
        version_value_overrides: []
        version_qf_overrides: []
        expect_not_acceptable_or_v12: true

  - id: 10,11 - FETCH DCAP (UNKNOWN VERSION)
    action: 
      type: refresh-resource
      parameters:
        resource: DeviceCapability
        version_value_overrides:
          - v99-beta
        version_qf_overrides:
          - 1
        expect_not_acceptable: true

  # We are slightly re-ordering the test as this step MUST prevent an EndDevice registration from occuring so
  # we do it first
  - id: 14,15 - POST EDEV (LEGACY VERSION)
    action: 
      type: insert-end-device
      parameters:
        invalid_version_header: true

  # This only exists to ensure the above action didn't populate the EndDeviceList
  - id: 15 - CHECK REJECTED
    action:
      type: discovery
      parameters:
        resources:
          - EndDevice
    checks:
      - type: end-device # There should still be no EndDevice registered
        parameters:
          matches_client: false

  # This is out of order because the legacy XML namespace ONLY applies to connection point. There is no csipaus ns on 
  # EndDevice that a client will populate. As such - we slightly re-order things and check it during ConnectionPoint
  # updating - that means we need to do a successful EndDevice registration first.
  - id: 16 - REGISTER EDEV
    action: 
      type: insert-end-device
      parameters: {} # This should succeed - we test the XML NS in the next step
        
  - id: 12,13 - PUT CP (LEGACY XMLNS)
    action: 
      type: upsert-connection-point
      parameters:
        connectionPointId: $(valid_nmi_1) # A valid NMI (in the testing range)
        legacy_xmlns: true # This will result in a rejection
        
  - id: 16 - PUT CP
    action: 
      type: upsert-connection-point
      parameters:
        connectionPointId: $(valid_nmi_1) # A valid NMI (in the testing range)
